name: Build and Publish Packages

# There is no path from this workflow to GitHub Pages. The published Pages
# repository is frozen serving the last poudriere-built set, because every
# existing cross-platform-actions VM image has a baked-in
# /usr/local/etc/pkg/repos/custom.conf pointing at it AND the upstream FreeBSD
# repositories disabled -- that site is their only source of packages, so
# replacing or emptying it leaves them with none.
#
# master froze it by removing the push trigger and gating the deploy job. Here
# the deploy job does not exist at all, which is why the push trigger can come
# back: a push cannot deploy something the workflow has no way to do. Restoring
# Pages would mean deliberately writing a job again, not flipping an input.
#
# Cross-compiled packages are published as GitHub releases instead. A release
# is immutable and additive -- a bad publish creates a bad release beside the
# good ones rather than replacing anything, and dropping an architecture leaves
# its last release fetchable at its tag forever. Every guard this repository
# accumulated around Pages was compensating for a whole-site replace; releases
# remove that failure mode rather than guarding it.
on:
  push:
    branches:
      # '**' not '*': a single star stops at '/', so a namespaced branch
      # (feature/foo) would never be validated.
      - '**'
  workflow_dispatch:

# contents: write to create releases. No pages or id-token: nothing here
# deploys, and the permissions should say so.
permissions:
  contents: write

jobs:
  generate-matrix:
    name: Generate build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate matrix
        id: matrix
        run: |
          matrix=$(sh scripts/generate-matrix.sh)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Cross-build ${{ matrix.target_arch }} (FreeBSD ${{ matrix.freebsd_version }})
    needs: generate-matrix
    runs-on: ubuntu-latest
    # The packages are cross-compiled on a KVM-accelerated FreeBSD/amd64 guest,
    # so a run is minutes rather than the hours QEMU user-mode emulation took.
    # This bound only exists to cap a hung VM boot.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Read the pinned ports branch so it can be passed into the guest.
      - name: Read ports branch
        id: cfg
        run: |
          branch=$(grep -v '^[[:space:]]*#' config/ports_branch \
              | grep -v '^[[:space:]]*$' | head -n1)
          echo "ports_branch=$branch" >> "$GITHUB_OUTPUT"

      # The guest is the BUILD HOST only: always FreeBSD/amd64, regardless of
      # which architecture is being targeted. The target's headers, libraries
      # and OS version come from the sysroot the script unpacks from base.txz,
      # so its version is matrix.freebsd_version and its architecture
      # matrix.target_arch.
      - name: Cross-build packages on FreeBSD/amd64
        uses: cross-platform-actions/action@v1.5.0
        env:
          TARGET_ARCH: ${{ matrix.target_arch }}
          RELEASE_MACHINE: ${{ matrix.release_machine }}
          FREEBSD_VERSION: ${{ matrix.freebsd_version }}
          PORTS_BRANCH: ${{ steps.cfg.outputs.ports_branch }}
        with:
          operating_system: freebsd
          architecture: x86-64
          version: ${{ matrix.freebsd_version }}
          memory: 12G
          cpu_count: 4
          shell: sh
          environment_variables: >-
            TARGET_ARCH RELEASE_MACHINE FREEBSD_VERSION PORTS_BRANCH
          # Runs as the unprivileged `runner` user (passwordless sudo). The
          # working dir maps to GITHUB_WORKSPACE, and the bidirectional sync
          # is what carries the built repository back out.
          run: |
            set -eux
            WORKSPACE="$PWD" sh scripts/cross-build.sh

      # The canonical `pkg repo` tree, uploaded as-is. It used to be tarred
      # under an ABI-named directory because upload-artifact rejects the colons
      # in FreeBSD:15:powerpc64 -- but that was only needed to assemble a Pages
      # site. A release takes the ABI from the packages themselves, so the
      # directory name carries no information and the workaround is gone.
      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.build_name }}
          path: packages

  # Everything in `build` proves the packages were assembled correctly. Only
  # this proves they RUN. riscv64 is the only target with a published guest
  # image (there is no powerpc64 one -- much of why its packages are wanted),
  # and both are produced by the identical pipeline, so a pass here is strong
  # evidence for powerpc64 without being proof of it.
  #
  # The guest is emulated: riscv64 on an x86-64 runner gets no KVM, so this is
  # slow in a way the cross-build itself deliberately is not. It only installs
  # packages and runs them, so slow is affordable.
  verify:
    name: Verify riscv64 packages on a real target
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download riscv64 packages
        uses: actions/download-artifact@v8
        with:
          name: packages-riscv64-150
          path: pkgrepo

      - name: Install and run the packages on FreeBSD/riscv64
        uses: cross-platform-actions/action@v1.5.0
        with:
          operating_system: freebsd
          architecture: riscv64
          version: '15.0'
          memory: 4G
          cpu_count: 2
          shell: sh
          # REPO_DIR is resolved inside the guest rather than forwarded: the
          # working directory maps to GITHUB_WORKSPACE, but its path there is
          # not the runner's.
          run: |
            set -eux
            REPO_DIR="$PWD/pkgrepo" sh scripts/verify-packages.sh

  # One release per architecture per distinct package set. Publishing is
  # additive, so this is safe in a way the Pages deploy never was -- but it
  # still waits on `verify`, because a release nobody can install from is worth
  # no more than a Pages deploy nobody can install from.
  #
  # Only master publishes; a branch push builds and verifies without creating
  # anything. Re-running on an unchanged set is a no-op: publish-release.sh
  # fingerprints the package set and skips when it matches the newest release
  # for that ABI, so repeated runs cannot spam releases.
  publish:
    name: Publish ${{ matrix.target_arch }} release
    needs: [generate-matrix, build, verify]
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download ${{ matrix.target_arch }} packages
        uses: actions/download-artifact@v8
        with:
          name: packages-${{ matrix.build_name }}
          path: pkgrepo

      # ABI is passed as an assertion, not as configuration: the script reads
      # the real ABI from the packages and fails if this disagrees, so it can
      # catch a wrong call site but never cause one.
      #
      # GH_REPO because gh otherwise infers the repository from the working
      # directory, and fails outside a checkout.
      - name: Publish as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ABI: FreeBSD:${{ matrix.major_version }}:${{ matrix.target_arch }}
        run: sh scripts/deploy/publish-release.sh pkgrepo
