# Disable ZFS -- the FreeBSD VM has no ZFS pool
NO_ZFS=yes

# Base directory for poudriere data
BASEFS=/usr/local/poudriere

# Where packages and logs are stored
POUDRIERE_DATA=${BASEFS}/data

# Use tmpfs for work directories to improve build speed and reduce disk I/O
USE_TMPFS=wrkdir

# Allow parallel make jobs within each port build
ALLOW_MAKE_JOBS=yes

# Bound the two factors that multiply into concurrent compiles. Poudriere
# defaults to one builder per CPU, and ALLOW_MAKE_JOBS otherwise lets each
# builder run an unbounded parallel make; on a 4-vCPU VM that compounds to
# well over a dozen simultaneous compiles, each holding its work directory
# in tmpfs (USE_TMPFS=wrkdir). That is the OOM cascade that previously
# forced the VM down to 2 vCPU. 4 builders x 2 make jobs oversubscribes the
# 4 vCPUs 2x, which suits QEMU user-mode emulation -- it is CPU-bound, so a
# stalled job yields rather than idling -- while keeping peak memory bounded.
PARALLEL_JOBS=4
MAKE_JOBS_NUMBER=2

# FreeBSD download mirror for jail creation
FREEBSD_HOST=https://download.FreeBSD.org

# Use the host's DNS configuration
RESOLV_CONF=/etc/resolv.conf

# Hostname for reproducible builds
BUILDER_HOSTNAME=pkg-builder

# Distfiles cache
DISTFILES_CACHE=/usr/local/poudriere/distfiles
