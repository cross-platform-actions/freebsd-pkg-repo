name: Build and Deploy Packages

# Entry points:
#   * a push to master builds every target and deploys the repository;
#   * a push to any other branch builds only, to validate the change;
#   * workflow_dispatch does the same as a branch push (see mock_build).
on:
  push:
    branches:
      # '**' not '*': a single star stops at '/', so a namespaced branch
      # (feature/foo) would never be validated.
      - '**'
  workflow_dispatch:
    inputs:
      mock_build:
        description: "Skip the VM build; generate fake packages to test the deploy path"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# NOTE: no workflow-level concurrency group. Only the Pages deploy needs
# serializing, and it carries its own group below. A workflow-level `pages`
# group would make every build -- including a branch push that never deploys --
# queue behind any other run of this workflow, so one long build blocks all
# validation behind it.

jobs:
  generate-matrix:
    name: Generate build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate matrix
        id: matrix
        run: |
          matrix=$(sh scripts/generate-matrix.sh)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Cross-build ${{ matrix.target_arch }} (FreeBSD ${{ matrix.freebsd_version }})
    needs: generate-matrix
    runs-on: ubuntu-latest
    # The packages are cross-compiled on a KVM-accelerated FreeBSD/amd64 guest,
    # so a run is minutes rather than the hours QEMU user-mode emulation took.
    # This bound only exists to cap a hung VM boot.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Shortcut for iterating on the deploy path: manually dispatch the
      # workflow with mock_build=true. A handful of empty .pkg files plus
      # the expected metadata filenames are generated so the rest of the
      # pipeline runs against a realistic `packages/` shape without waiting
      # for the real VM.
      - name: Mock build -- generate fake packages
        if: ${{ inputs.mock_build }}
        run: |
          mkdir -p packages/All packages/Latest
          # One package per origin in config/pkglist, so the mock exercises the
          # publish guard rather than tripping it.
          for p in bash-5.3.9 sudo-1.9.17p2_2 curl-8.19.0_2 rsync-3.4.1_7 pkg-2.7.4; do
              echo mock > "packages/All/${p}.pkg"
          done
          echo mock > packages/Latest/pkg.pkg
          # Non-empty: the guard requires a usable-looking repository, and an
          # empty catalogue is exactly the failure it exists to catch.
          for f in meta.conf meta data.pkg packagesite.pkg; do
              echo mock > "packages/$f"
          done

      # Read the pinned ports branch so it can be passed into the guest.
      - name: Read ports branch
        if: ${{ !inputs.mock_build }}
        id: cfg
        run: |
          branch=$(grep -v '^[[:space:]]*#' config/ports_branch \
              | grep -v '^[[:space:]]*$' | head -n1)
          echo "ports_branch=$branch" >> "$GITHUB_OUTPUT"

      # The guest is the BUILD HOST only: always FreeBSD/amd64, regardless of
      # which architecture is being targeted. The target's headers, libraries
      # and OS version come from the sysroot the script unpacks from
      # base.txz, so its version is matrix.freebsd_version and its
      # architecture matrix.target_arch.
      - name: Cross-build packages on FreeBSD/amd64
        if: ${{ !inputs.mock_build }}
        uses: cross-platform-actions/action@v1.5.0
        env:
          TARGET_ARCH: ${{ matrix.target_arch }}
          RELEASE_MACHINE: ${{ matrix.release_machine }}
          FREEBSD_VERSION: ${{ matrix.freebsd_version }}
          PORTS_BRANCH: ${{ steps.cfg.outputs.ports_branch }}
        with:
          operating_system: freebsd
          architecture: x86-64
          version: ${{ matrix.freebsd_version }}
          memory: 12G
          cpu_count: 4
          shell: sh
          environment_variables: >-
            TARGET_ARCH RELEASE_MACHINE FREEBSD_VERSION PORTS_BRANCH
          # Runs as the unprivileged `runner` user (passwordless sudo). The
          # working dir maps to GITHUB_WORKSPACE, and the bidirectional sync
          # is what carries the built repository back out.
          run: |
            set -eux
            WORKSPACE="$PWD" sh scripts/cross-build.sh

      # Tarball the site directory. actions/upload-artifact rejects paths
      # containing colons (Windows filesystem compat), but pkg clients
      # require ABI paths like FreeBSD:15:powerpc64. The final pages artifact
      # is itself a tarball and does preserve colons, so we only need to
      # work around the intermediate upload/download step.
      - name: Prepare site tarball
        run: |
          abi_dir="FreeBSD:${{ matrix.major_version }}:${{ matrix.target_arch }}"
          mkdir -p "_site/$abi_dir"
          cp -R packages/. "_site/$abi_dir/"
          tar -C _site -czf site.tar.gz .

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-${{ matrix.build_name }}
          path: site.tar.gz

  # Everything in `build` proves the packages were assembled correctly. Only
  # this proves they RUN. riscv64 is the only target with a published guest
  # image (there is no powerpc64 one -- much of why its packages are wanted),
  # and both are produced by the identical pipeline, so a pass here is strong
  # evidence for powerpc64 without being proof of it.
  #
  # The guest is emulated: riscv64 on an x86-64 runner gets no KVM, so this is
  # slow in a way the cross-build itself deliberately is not. It only installs
  # packages and runs them, so slow is affordable.
  verify:
    name: Verify riscv64 packages on a real target
    needs: build
    # A mock build produces placeholder files, not packages; there is nothing
    # to install and nothing to learn from trying.
    if: ${{ !inputs.mock_build }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download riscv64 packages
        uses: actions/download-artifact@v8
        with:
          name: site-riscv64-150
          path: artifact

      # The artifact is a tarball because upload-artifact rejects the colons in
      # an ABI path. Unpack it to a colon-free directory: it becomes a file://
      # URL inside the guest, and there is no reason to make pkg parse that.
      - name: Unpack into a pkg repository
        run: |
          mkdir -p site pkgrepo
          tar -xzf artifact/site.tar.gz -C site
          cp -R "site/FreeBSD:15:riscv64/." pkgrepo/
          ls -l pkgrepo pkgrepo/All | head -30

      - name: Install and run the packages on FreeBSD/riscv64
        uses: cross-platform-actions/action@v1.5.0
        with:
          operating_system: freebsd
          architecture: riscv64
          version: '15.0'
          memory: 4G
          cpu_count: 2
          shell: sh
          # REPO_DIR is resolved inside the guest rather than forwarded: the
          # working directory maps to GITHUB_WORKSPACE, but its path there is
          # not the runner's.
          run: |
            set -eux
            REPO_DIR="$PWD/pkgrepo" sh scripts/verify-packages.sh

  deploy:
    name: Deploy to GitHub Pages
    # Gated on verify as well as build: publishing packages that do not run is
    # exactly the failure this repository exists to avoid. If the emulated
    # guest ever becomes too flaky to gate on, drop `verify` from this list.
    needs: [build, verify]
    # A branch push validates the build; only master publishes. `verify` is
    # skipped for a mock build, and a skipped dependency would otherwise block
    # this job -- leaving the deploy path untestable, which is the one thing
    # mock_build exists for. So require success from build, and success-or-
    # skipped from verify.
    if: >-
      ${{ always()
          && github.ref == 'refs/heads/master'
          && needs.build.result == 'success'
          && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    runs-on: ubuntu-latest
    # Pages deploys must not overlap; builds may.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: site-*

      - name: Extract tarballs into _site
        run: sh scripts/deploy/extract-artifacts.sh

      # A Pages deployment replaces the whole site, so publishing a degraded
      # set silently destroys the live repository -- which is how a terminated
      # build once wiped it. Last gate before that becomes irreversible.
      - name: Verify the package set before publishing
        run: sh scripts/deploy/verify-site.sh

      - name: Generate landing page
        env:
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: sh scripts/deploy/generate-landing-page.sh

      - name: Generate directory indexes
        run: sh scripts/deploy/generate-directory-indexes.sh

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
